name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: erp_owner, POSTGRES_PASSWORD: erp_owner, POSTGRES_DB: erp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp_owner -d erp" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
      - name: Create database roles (same script docker compose uses)
        working-directory: .
        env: { PGHOST: localhost, PGPASSWORD: erp_owner, POSTGRES_USER: erp_owner, POSTGRES_DB: erp }
        run: sh infra/postgres/01-roles.sh
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app seed
      - run: uv run pytest
      - name: OpenAPI schema is up to date
        run: uv run python -m scripts.export_openapi && git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run -s gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run -s typecheck
      - run: npm run -s lint
      - run: npm run -s format:check
      - run: npm test
      - run: npm run -s build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test --trace off
        env: { CI: "1" }
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs api worker web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report }
